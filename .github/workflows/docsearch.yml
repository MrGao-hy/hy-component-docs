name: docsearch

on:
  push:
    branches:
      - master

jobs:
  algolia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull scraper image
        run: docker pull algolia/docsearch-scraper

      - name: Run algolia/docsearch-scraper
        env:
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -euo pipefail
          CONFIG=$(jq -r tostring docsearch.json)
          echo "CONFIG=$CONFIG"
          docker run --rm \
            --env APPLICATION_ID="$APPLICATION_ID" \
            --env API_KEY="$API_KEY" \
            --env CONFIG="$CONFIG" \
            algolia/docsearch-scraper
